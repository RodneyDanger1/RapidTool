<svg xmlns="http://www.w3.org/2000/svg" width="880" height="478" viewBox="0 0 880 478" role="img" aria-label="HVAC Dispatch — gate flow" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
<title>HVAC Dispatch — gate flow</title>
<rect x="0" y="0" width="880" height="478" fill="#0d1117"/>
<defs><marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4351"/></marker><marker id="dg-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker></defs>
<text x="20" y="28" font-size="15" fill="#e6edf3" font-weight="700">HVAC Dispatch — gate flow</text>
<text x="20" y="47" font-size="10" fill="#8b949e">P12 · Documentation &amp; Technical Specs — pipeline complete — all 13 phases sealed</text>
<rect x="740" y="12" width="116" height="24" rx="6" fill="#10151c" stroke="#3fb950" stroke-width="1.25" data-node="chip"/>
<text x="798" y="28" font-size="10.5" fill="#c9d1d9" font-weight="600" text-anchor="middle">complete · P12</text>
<rect x="110" y="64" width="300" height="46" rx="6" fill="#10151c" stroke="#30363d" stroke-width="1.25" data-node="handoff"/>
<text x="260" y="91" font-size="10.5" fill="#c9d1d9" font-weight="600" text-anchor="middle">Handoff — P12 ready</text>
<line x1="260" y1="110" x2="260" y2="150" stroke="#3a4351" stroke-width="1.25" marker-end="url(#dg-a)"/>
<rect x="110" y="150" width="300" height="46" rx="6" fill="#10151c" stroke="#58a6ff" stroke-width="1.25" data-node="run"/>
<text x="260" y="177" font-size="10.5" fill="#c9d1d9" font-weight="600" text-anchor="middle">Execute — synthesize &amp; self-test</text>
<line x1="260" y1="196" x2="260" y2="244" stroke="#3a4351" stroke-width="1.25" marker-end="url(#dg-a)"/>
<polygon points="260,244 390,300 260,356 130,300" fill="#10151c" stroke="#d2a8ff" stroke-width="1.25" data-node="gate"/>
<text x="260" y="296" font-size="9.5" fill="#c9d1d9" text-anchor="middle">DoD gate</text>
<text x="260" y="313" font-size="8.5" fill="#8b949e" text-anchor="middle">machine checks</text>
<line x1="390" y1="300" x2="570" y2="300" stroke="#3a4351" stroke-width="1.25" marker-end="url(#dg-a)"/>
<rect x="570" y="258" width="280" height="44" rx="6" fill="#10151c" stroke="#3fb950" stroke-width="1.25" data-node="approve"/>
<text x="710" y="284" font-size="10.5" fill="#c9d1d9" font-weight="600" text-anchor="middle">Approve — seal P12</text>
<line x1="710" y1="302" x2="710" y2="348" stroke="#3a4351" stroke-width="1.25" marker-end="url(#dg-a)"/>
<rect x="570" y="348" width="280" height="44" rx="6" fill="#1c1608" stroke="#ffd33d" stroke-width="2.4" data-node="sealed" data-highlight="true"/>
<text x="710" y="374" font-size="10.5" fill="#ffd33d" font-weight="600" text-anchor="middle">All phases sealed — done</text>
<line x1="260" y1="356" x2="260" y2="400" stroke="#3a4351" stroke-width="1.25" marker-end="url(#dg-a)"/>
<rect x="150" y="400" width="220" height="40" rx="6" fill="#10151c" stroke="#f85149" stroke-width="1.25" data-node="reject"/>
<text x="260" y="424" font-size="10.5" fill="#c9d1d9" font-weight="600" text-anchor="middle">Reject → revise &amp; retry</text>
<path d="M150,420 H64 V173 H110" fill="none" stroke="#f85149" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#dg-r)"/>
<rect x="26" y="452" width="10" height="10" rx="6" fill="#1c1608" stroke="#ffd33d" stroke-width="2.4"/>
<text x="42" y="462" font-size="9" fill="#8b949e">active path</text>
<path d="M150,462 H186" fill="none" stroke="#f85149" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="196" y="462" font-size="9" fill="#8b949e">retry loop</text>
</svg>
